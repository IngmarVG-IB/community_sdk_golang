# golangci-lint v2 configuration. Reference: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  build-tags:
    - examples

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G115 # integer overflow conversion: noisy for generated proto int types
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
    rules:
      # Legacy v5 REST code is frozen (deprecated); keep lint noise out of it.
      - path: ^kentikapi/(internal/(api_connection|api_endpoints|api_payloads|resources|utils|convert|httputil|testutil|validation)|models)/
        linters: [staticcheck, gosec, errorlint]
      # Legacy cloud_export v202101beta1 layer: the proto marks fields deprecated; the layer is itself deprecated.
      - path: ^kentikapi/(internal/cloud/|cloud_exports_integration_test\.go)
        linters: [staticcheck]
        text: SA1019
      # Legacy code and its tests/examples exercise deprecated identifiers on purpose.
      - path: ^(examples/legacy/|kentikapi/(internal/|models/|cloud/)|kentikapi/[a-z_]+_integration_test\.go)
        linters: [staticcheck]
        text: SA1019
      # Developer tools read paths given on the command line by the developer.
      - path: ^internal/cmd/
        linters: [gosec]
        text: "G(304|703)"
      - path: _test\.go
        linters: [gosec, bodyclose]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kentik/community_sdk_golang
